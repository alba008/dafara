name: dafara
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - dafara_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - dafara_static:/app/staticfiles
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["127.0.0.1:8091:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - dafara_static:/static:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  dafara_db:
  dafara_static:
