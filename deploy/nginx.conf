limit_req_zone $binary_remote_addr zone=dafara_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dafara_form:10m rate=10r/m;
server {
    listen 80;
    client_max_body_size 20m;
    location /media/ {
        alias /media/;
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }
    location /static/ { alias /static/; }
    location = /login/ {
        limit_req zone=dafara_login burst=5 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location ~ ^/(donate|contact|volunteer)/$ {
        limit_req zone=dafara_form burst=10 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
